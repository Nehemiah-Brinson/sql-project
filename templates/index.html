<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Movie Finder</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #673b88;
      --panel: #9b4994;
      --panel-light: #222a3d;
      --text: #f5f7fb;
      --muted: #f70c0c;
      --accent: #ec9109;
      --accent-dark: #d78a1b;
      --border: #18306d;
      --danger: #ff0aff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at top right, #263452 0, var(--background) 48%);
    }

    main { width: min(1120px, calc(100% - 32px)); margin: 0 auto; padding: 56px 0 72px; }
    .eyebrow { color: var(--accent); font-size: .78rem; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 10px 0 12px; font-size: clamp(2.4rem, 7vw, 4.8rem); line-height: .98; }
    .intro { max-width: 620px; margin: 0 0 30px; color: var(--muted); font-size: 1.08rem; line-height: 1.6; }
    .search-panel, .results-panel { border: 1px solid var(--border); border-radius: 20px; background: rgba(25, 30, 45, .92); box-shadow: 0 20px 70px rgba(0, 0, 0, .22); }
    .search-panel { padding: 22px; }
    .fields { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    label { display: grid; gap: 7px; color: var(--muted); font-size: .85rem; font-weight: 700; }
    input, select, button { width: 100%; min-height: 46px; border: 1px solid var(--border); border-radius: 10px; font: inherit; }
    input, select { padding: 0 13px; color: var(--text); background: var(--panel-light); }
    input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
    button { width: auto; padding: 0 20px; color: #20170b; background: var(--accent); border: 0; cursor: pointer; font-weight: 800; }
    button:hover { background: #ffca72; }
    button.secondary { color: var(--text); background: transparent; border: 1px solid var(--border); }
    button.secondary:hover { background: var(--panel-light); }
    .status { min-height: 24px; margin: 18px 2px 0; color: var(--muted); }
    .status.error { color: var(--danger); }
    .results-panel { margin-top: 20px; overflow: hidden; }
    .results-header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding: 20px 22px; border-bottom: 1px solid var(--border); }
    h2 { margin: 0; font-size: 1.2rem; }
    #result-count { color: var(--muted); font-size: .9rem; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; padding: 18px; }
    .movie { padding: 17px; border: 1px solid var(--border); border-radius: 14px; background: var(--panel-light); }
    .movie h3 { margin: 0 0 13px; font-size: 1.05rem; }
    .movie p { margin: 6px 0 0; color: var(--muted); font-size: .9rem; }
    .empty { grid-column: 1 / -1; padding: 28px 8px; color: var(--muted); text-align: center; }
    @media (max-width: 720px) { main { padding-top: 32px; } .fields { grid-template-columns: 1fr; } .results-header { align-items: flex-start; flex-direction: column; } }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Movie searcher</div>
    <h1>Find your next movie.</h1>
    <p class="intro">Search by title, actor, director, or genre. Combine actor, director, and genre filters to discover movies that match them all.</p>

    <section class="search-panel" aria-label="Movie search">
      <div class="fields">
        <label>Title
          <input id="title" type="text"">
        </label>
        <label>Actor
          <input id="actor" type="text"">
        </label>
        <label>Director
          <input id="director" type="text" ">
        </label>
        <label>Genre
          <input id="genre" type="text"">
        </label>
      </div>
      <div class="actions">
        <button id="search" type="button">Search movies</button>
        <button id="recommend" class="secondary" type="button">Show recommendations</button>
        <button id="clear" class="secondary" type="button">Clear</button>
      </div>
      <p id="status" class="status" role="status"></p>
    </section>

    <section class="results-panel" aria-live="polite">
      <div class="results-header">
        <h2>Results</h2>
        <span id="result-count"></span>
      </div>
      <div id="results" class="cards">
        <div class="empty">Search above to browse the movie database.</div>
      </div>
    </section>
  </main>

  <script>
    const fields = ["title", "actor", "director", "genre"];
    const value = (name) => document.getElementById(name).value.trim();
    const pathPart = (name) => encodeURIComponent(value(name));
    const status = document.getElementById("status");
    const results = document.getElementById("results");
    const count = document.getElementById("result-count");

    function result(movies) {
      count.textContent = `${movies.length} result${movies.length === 1 ? "" : "s"}`;
      if (!movies.length) {
        results.innerHTML = '<div class="empty">No movies matched those filters.</div>';
        return;
      }
      results.innerHTML = movies.map((movie) => `
        <article class="movie">
          <h3>${stopCrash(movie.title || "Untitled")}</h3>
          <p>${movie.year || "Year unavailable"}${movie.runtime ? ` · ${movie.runtime} min` : ""}</p>
          <p>${movie.rating ? `★ ${Number(movie.rating).toFixed(1)} rating` : "Rating unavailable"}</p>
        </article>
      `).join("");
    }

    function stopCrash(text) {
      return String(text).replace(/[&<>"']/g, (character) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
      }[character]));
    }

    function findStuff() {
      const active = fields.filter((field) => value(field));
      if (!active.length) return null;
      if (active.length === 1) return `/${active[0] === "title" ? "movie" : active[0]}/${pathPart(active[0])}`;
      if (active.length === 2 && active.includes("actor") && active.includes("genre")) return `/genreActor/${pathPart("genre")}/${pathPart("actor")}`;
      if (active.length === 2 && active.includes("director") && active.includes("genre")) return `/genreDirector/${pathPart("genre")}/${pathPart("director")}`;
      if (active.length === 2 && active.includes("actor") && active.includes("director")) return `/actorDirector/${pathPart("actor")}/${pathPart("director")}`;
      if (active.length === 3 && active.includes("actor") && active.includes("genre") && active.includes("director")) return `/actorGenreDirector/${pathPart("actor")}/${pathPart("genre")}/${pathPart("director")}`;
      return null;
    }

    async function load(path) {
      status.className = "status";
      status.textContent = "Searching...";
      try {
        const response = await fetch(path);
        if (!response.ok) throw new Error(`Request failed (${response.status})`);
        result(await response.json());
        status.textContent = "";
      } catch (error) {
        count.textContent = "";
        status.className = "status error";
        status.textContent = error.message;
      }
    }

    document.getElementById("search").addEventListener("click", () => {
      const path = findStuff();
      if (!path) {
        status.className = "status error";
        status.textContent = "Enter one filter, or use a supported combination of filters.";
        return;
      }
      load(path);
    });
    document.getElementById("recommend").addEventListener("click", () => load("/recommendation"));
    document.getElementById("clear").addEventListener("click", () => {
      fields.forEach((field) => { document.getElementById(field).value = ""; });
      count.textContent = "";
      status.className = "status";
      status.textContent = "";
      results.innerHTML = '<div class="empty">Search above to browse the movie database.</div>';
    });
    fields.forEach((field) => document.getElementById(field).addEventListener("keydown", (event) => {
      if (event.key === "Enter") document.getElementById("search").click();
    }));
  </script>
</body>
</html>
