<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMDb Analytics Dashboard</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/analytics.css') }}">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <h1>IMDb Analytics Dashboard</h1>

    <div id="overview-container">

        <div class="card">
            <h2>Movies</h2>
            <p id="movies-card">Loading...</p>
        </div>

        <div class="card">
            <h2>Actors</h2>
            <p id="actors-card">Loading...</p>
        </div>

        <div class="card">
            <h2>Directors</h2>
            <p id="directors-card">Loading...</p>
        </div>

        <div class="card">
            <h2>Genres</h2>
            <p id="genres-card">Loading...</p>
        </div>

    </div>

    <h2>Top Genres</h2>

    <div class="chart-container">
        <canvas id="genreChart"></canvas>
    </div>

    <script src="{{ url_for('static', filename='js/analytics.js') }}"></script>

</body>
</html>
