<!DOCTYPE html>
<html>
<head>
    <title>IMDb Search</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="p-4">
    <h1>IMDb Search</h1>

    <form action="/movie" method="GET">
        <input class="form-control" name="title" placeholder="Search movie...">
    </form>

    <form action="/actor" method="GET" class="mt-3">
        <input class="form-control" name="name" placeholder="Search actor...">
    </form>

    <form action="/genre" method="GET" class="mt-3">
        <input class="form-control" name="genre" placeholder="Search genre...">
    </form>
</body>    
</html>
